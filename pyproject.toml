[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nonebot-plugin-fx-tracker"
version = "0.1.0"
description = "汇率关注插件（测试）：支持法定货币与虚拟货币，个人关注列表，默认关闭、管理员开启"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "nonebot2[fastapi]>=2.4.0",
    "nonebot-adapter-onebot>=2.4.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "eval_type_backport>=0.2.0; python_version < '3.10'",
]

[tool.setuptools]
packages = ["fx_tracker"]
